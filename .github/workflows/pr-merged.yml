name: PR Merged

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: read

defaults:
  run:
    shell: bash

jobs:
  merged:
    name: Show info
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-24.04-arm
    steps:
      # Checkout CI scripts from the latest commit from the base branch.
      # This ensures we get the latest scripts, even if the PR's base was outdated.
      - name: Checkout base branch
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            flake/dev/diff-plugins.py
            flake/dev/plugin-announcements.py
            flake.lock
          sparse-checkout-cone-mode: false

      - name: Get nixpkgs
        id: nixpkgs
        run: |
          jq --raw-output --exit-status '
            .nodes[.nodes[.root].inputs.nixpkgs].locked
            | "https://github.com/\(.owner)/\(.repo)/archive/\(.rev).tar.gz"
            | "url=\(.)"
          ' flake.lock >> "$GITHUB_OUTPUT"

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=${{ steps.nixpkgs.outputs.url }}
          extra_nix_config: |
            accept-flake-config = true

      - name: Compare base -> merge
        id: diff
        env:
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          out=$(mktemp)
          ./flake/dev/diff-plugins.py --compact "$base" "$head" > "$out"
          {
            echo -n 'json='
            jq -c . < "$out"
          } >> "$GITHUB_OUTPUT"
          jq . < "$out"

      - name: Print summary
        env:
          json: ${{ steps.diff.outputs.json }}
        run: |
          {
            echo '## JSON plugin diff: base -> merge'
            echo
            echo '```json'
            echo "$json" | jq .
            echo '```'
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate plugin announcements
        id: announcements
        env:
          diff: ${{ steps.diff.outputs.json }}
          head: ${{ github.event.pull_request.merge_commit_sha }}
          pr_number: ${{ github.event.pull_request.number }}
          pr_url: ${{ github.event.pull_request.html_url }}
          pr_author_name: ${{ github.event.pull_request.user.login }}
          pr_author_url: ${{ github.event.pull_request.user.html_url }}
        run: |
          out=$(mktemp)
          ./flake/dev/plugin-announcements.py \
            --compact \
            --diff-json "$diff" \
            --flake-ref "github:${{ github.repository }}/$head" \
            --pr-number "$pr_number" \
            --pr-url "$pr_url" \
            --pr-author-name "$pr_author_name" \
            --pr-author-url "$pr_author_url" \
            > "$out"

          {
            echo -n 'json='
            jq -c . < "$out"
          } >> "$GITHUB_OUTPUT"

          jq -r .summary_markdown < "$out" >> "$GITHUB_STEP_SUMMARY"
          jq . < "$out"

      - name: Comment when announcements need manual review
        if: ${{ fromJSON(steps.announcements.outputs.json).blocked }}
        env:
          GH_TOKEN: ${{ github.token }}
          pr_number: ${{ github.event.pull_request.number }}
          json: ${{ steps.announcements.outputs.json }}
        run: |
          body=$(mktemp)
          jq -r .comment_markdown <<< "$json" > "$body"
          gh pr comment "$pr_number" \
            --repo "${{ github.repository }}" \
            --body-file "$body"
